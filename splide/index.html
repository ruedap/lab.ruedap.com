<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta content='width=device-width, initial-scale=1' name='viewport'>
    <title>test</title>
    <link rel="stylesheet" href="splide_files/css/splide.min.css">
    <style>
      body {
        margin: 0;
      }
    </style>
    <script src="splide_files/js/splide.min.js" defer></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        var splide = new Splide( '.splide', {
          type       : 'loop',
          width: '200',
          height     : '300',
          perPage    : 3,
          drag   : 'free',
          snap   : true,
          focus  : 'center',
          breakpoints: {
            640: {
              width: '250',
              height: '400'
            },
          },
        } );
        splide.mount();

      })
    </script>
    <style>
      * {
        box-sizing: border-box;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
      }

      .splide__slide__container {
      }

      .d-Splide-item {
        display: flex;
        justify-content: center;
      }

      .d-Splide-container {
        border: 1px solid rgb(204, 204, 204);
        padding: 8px;
        width: 200px;
        height: 412px;
      }

      .d-Splide-image {
        width: 184px;
        height: 184px;
      }
    </style>

  </head>
  <body>
    <div class="container">
      <section class="splide" aria-label="Splide Basic HTML Example">
        <div class="splide__track">
          <ul class="splide__list">
            <li class="splide__slide d-Splide-item">
              <div class="splide__slide__container d-Splide-container">
                <img class="d-Splide-image" src="./001.png" alt="">
                <div>Slide 01</div>
              </div>
            </li>
            <li class="splide__slide d-Splide-item">
              <div class="splide__slide__container d-Splide-container">
                <img class="d-Splide-image" src="./002.png" alt="">
                <div>Slide 02</div>
              </div>
            </li>
            <li class="splide__slide d-Splide-item">
              <div class="splide__slide__container d-Splide-container">
                <img class="d-Splide-image" src="./003.png" alt="">
                <div>Slide 03</div>
              </div>
            </li>
            <li class="splide__slide d-Splide-item">
              <div class="splide__slide__container d-Splide-container">
                <img class="d-Splide-image" src="./004.png" alt="">
                <div>Slide 04</div>
              </div>
            </li>
            <li class="splide__slide d-Splide-item">
              <div class="splide__slide__container d-Splide-container">
                <img class="d-Splide-image" src="./005.png" alt="">
                <div>Slide 05</div>
              </div>
            </li>
          </ul>
        </div>
      </section>
    </div>
  </body>
</html>
