<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta content='width=device-width, initial-scale=1' name='viewport'>
    <title>test</title>
    <link rel="stylesheet" href="splide_files/css/splide.min.css">
    <style>
      body {
        margin: 0;
      }
    </style>
    <script src="splide_files/js/splide.min.js" defer></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        var splide = new Splide( '.splide', {
          type       : 'loop',
          fixedWidth: '200',
          fixedHeight     : '400',
          perPage    : 3,
          drag   : 'free',
          snap   : true,
          focus  : 'center',
          mediaQuery: 'min',
          breakpoints: {
            800: {
              focus  : 0,
              perPage    : 4
            },
          },
        } );
        splide.mount();

      })
    </script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        background-color: #aaa;
      }

      .container {
        max-width: 900px;
        height: 2000px;
        margin: 0 auto;
        background-color: #fff;
      }

      .outer {

        display: flex;
        justify-content: center;
        margin: 0 auto;
      }

      .splide__arrow {
        top: auto;
        bottom: -50px;

        @media screen and (min-width: 900px) {
          top: 50%;
          bottom: auto;
        }
      }

      .splide__pagination {
        bottom: -30px;
      }

      .splide__pagination__page {
        pointer-events: none;
      }
      .splide__pagination__page.is-active {
        background: skyblue;
      }

      .d-Splide {
        width: 100%;
      }

      .d-Splide-track {
        @media screen and (min-width: 820px) {
          width: 800px;
          margin: 0 auto;
        }
      }

      .d-Splide-item {
        display: flex;
        justify-content: center;
      }

      .d-Splide-item.is-active {
        border-color: #f00;
      }

      .d-Splide-container {
        border: 1px solid rgb(204, 204, 204);
        padding: 8px;
        width: 200px;
        height: 412px;
      }

      .d-Splide-image {
        width: 184px;
        height: 184px;
      }
    </style>

  </head>
  <body>
    <div class="container">
      <h1>Splide test</h1>
      <div class="outer">
        <section class="splide d-Splide" aria-label="Splide Basic HTML Example">
          <div class="splide__track d-Splide-track">
            <ul class="splide__list">
              <li class="splide__slide d-Splide-item">
                <div class="splide__slide__container d-Splide-container">
                  <img class="d-Splide-image" src="./001.png" alt="">
                  <a href="https://www.google.com" class="d-Splide-link">Slide 01</a>
                </div>
              </li>
              <li class="splide__slide d-Splide-item">
                <div class="splide__slide__container d-Splide-container">
                  <img class="d-Splide-image" src="./002.png" alt="">
                  <a href="https://www.google.com" class="d-Splide-link">Slide 02</a>
                </div>
              </li>
              <li class="splide__slide d-Splide-item">
                <div class="splide__slide__container d-Splide-container">
                  <img class="d-Splide-image" src="./003.png" alt="">
                  <a href="https://www.google.com" class="d-Splide-link">Slide 03</a>
                </div>
              </li>
              <li class="splide__slide d-Splide-item">
                <div class="splide__slide__container d-Splide-container">
                  <img class="d-Splide-image" src="./004.png" alt="">
                  <a href="https://www.google.com" class="d-Splide-link">Slide 04</a>
                </div>
              </li>
              <li class="splide__slide d-Splide-item">
                <div class="splide__slide__container d-Splide-container">
                  <img class="d-Splide-image" src="./005.png" alt="">
                  <a href="https://www.google.com" class="d-Splide-link">Slide 05</a>
                </div>
              </li>
              <li class="splide__slide d-Splide-item">
                <div class="splide__slide__container d-Splide-container">
                  <img class="d-Splide-image" src="./006.png" alt="">
                  <a href="https://www.google.com" class="d-Splide-link">Slide 06</a>
                </div>
              </li>
              <li class="splide__slide d-Splide-item">
                <div class="splide__slide__container d-Splide-container">
                  <img class="d-Splide-image" src="./007.png" alt="">
                  <a href="https://www.google.com" class="d-Splide-link">Slide 07</a>
                </div>
              </li>
              <li class="splide__slide d-Splide-item">
                <div class="splide__slide__container d-Splide-container">
                  <img class="d-Splide-image" src="./008.png" alt="">
                  <a href="https://www.google.com" class="d-Splide-link">Slide 08</a>
                </div>
              </li>
              <li class="splide__slide d-Splide-item">
                <div class="splide__slide__container d-Splide-container">
                  <img class="d-Splide-image" src="./009.png" alt="">
                  <a href="https://www.google.com" class="d-Splide-link">Slide 09</a>
                </div>
              </li>
            </ul>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
